volumes:
    mongo-data:
    composer-cache:

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: api
        working_dir: /var/www/html
        ports:
            - "8022:8022"
        volumes:
            - composer-cache:/tmp
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: ${DB_CONNECTION:-mongodb}
            DB_HOST: ${DB_HOST:-mongo}
            DB_PORT: ${DB_PORT:-27017}
            DB_DATABASE: ${DB_DATABASE:-laravel}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD:-example}
        depends_on:
            - mongo
        restart: unless-stopped
        command: >
            sh -c "
            chmod -R 775 storage bootstrap &&
            php artisan key:generate --force &&
            php artisan optimize:clear &&
            php artisan serve --host=0.0.0.0 --port=8022
            "
        healthcheck:
            test: [ "CMD", "php", "-v" ]
            interval: 30s
            timeout: 10s
            retries: 3

    mongo:
        image: mongo:7
        container_name: mongo-db
        ports:
            - "27022:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-root}
            MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-example}
            MONGO_INITDB_DATABASE: ${DB_DATABASE:-laravel}
        volumes:
            - mongo-data:/data/db
        command: mongod --auth
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
            interval: 10s
            timeout: 10s
            retries: 5
          
