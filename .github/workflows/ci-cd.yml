name: CI/CD Nishin

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        options: >-
          --health-cmd="mongosh --username root --password example --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, mbstring, bcmath, xml
          ini-values: post_max_size=256M, max_execution_time=300
          coverage: none

      - name: Prepare writable directories
        working-directory: ./nishin-403
        run: |
          echo "📁 Préparation des dossiers Laravel..."
          mkdir -p storage/logs \
                  storage/framework/cache \
                  storage/framework/sessions \
                  storage/framework/views \
                  bootstrap/cache
          touch storage/logs/laravel.log
          chmod -R 775 storage bootstrap

      - name: Install Composer deps (cached)
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist
          working-directory: ./nishin-403

      - name: Prepare app
        working-directory: ./nishin-403
        env:
          DB_CONNECTION: mongodb
          DB_HOST: 127.0.0.1
          DB_PORT: 27017
          DB_DATABASE: genshin_test
          DB_USERNAME: root
          DB_PASSWORD: example
        run: |
          [ -f .env ] || cp .env.example .env
          php artisan key:generate --ansi
          php artisan optimize:clear

      - name: Install mongosh
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-archive-keyring.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Wait for MongoDB (auth)
        run: |
          for i in {1..60}; do
            if mongosh --host 127.0.0.1 --port 27017 -u root -p example --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' --quiet; then
              echo "MongoDB ready"; exit 0; fi
            echo "Waiting for MongoDB..."
            sleep 1
          done
          echo "MongoDB did not become ready" && exit 1

      - name: Run tests
        working-directory: ./nishin-403
        env:
          APP_ENV: testing
          DB_CONNECTION: mongodb
          DB_HOST: 127.0.0.1
          DB_PORT: "27017"
          DB_DATABASE: genshin_test
          DB_USERNAME: root
          DB_PASSWORD: example
        run: |
          php artisan test --env=testing \
            --log-junit build/junit.xml || EXIT=$?
          mkdir -p build && echo "${EXIT:-0}" > build/exitcode
          exit "${EXIT:-0}"
  
  deploy:
    needs: build_and_test
    runs-on: self-hosted
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.build_and_test.result == 'success'

    steps:
      - name: 🧹 Clean workspace before checkout
        run: |
          echo "🧹 Cleaning workspace manually before checkout..."
          sudo rm -rf $GITHUB_WORKSPACE/nishin-403 || true
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true

      - uses: actions/checkout@v4

      - name: Set up environment
        working-directory: ./nishin-403
        run: |
          echo "🔧 Preparing production environment..."
          cp .env.example .env
          
      - name: Prepare writable directories
        working-directory: ./nishin-403
        run: |
          echo "📁 Préparation des dossiers Laravel..."
          mkdir -p storage/logs \
                  storage/framework/cache \
                  storage/framework/sessions \
                  storage/framework/views \
                  bootstrap/cache
          touch storage/logs/laravel.log
          chmod -R 775 storage bootstrap

      - name: Build & deploy Docker containers
        working-directory: ./nishin-403
        run: |
          echo "🚀 Building and deploying Docker containers..."
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Run seeds
        working-directory: ./nishin-403
        env:
          DB_HOST: 0.0.0.0
          DB_PORT: 27022
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_AUTH_SOURCE: admin
        run: |
          echo "🌱 Running seeds..."
          php artisan db:seed --force

